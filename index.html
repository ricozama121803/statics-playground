<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Reactions</title>
<style>
  :root {
    --bg: #fafaf8; --fg: #1d1d1b; --muted: #8a8a85; --line: #e4e4df;
    --member: #9aa0a6; --ground: #5f6368; --force: #4b3fa8; --moment: #1f8a4c; --accent: #4b3fa8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --fg: #ececea; --muted: #7c7c78; --line: #2b2b2d;
      --member: #6f757c; --ground: #9aa0a6; --force: #a99cff; --moment: #55c785; --accent: #a99cff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, sans-serif;
    display: grid; grid-template-columns: 220px 1fr; min-height: 100vh;
  }
  nav { padding: 32px 16px 32px 24px; border-right: 1px solid var(--line); }
  nav button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 5px 0; font: inherit; color: var(--muted); cursor: pointer;
  }
  nav button:hover { color: var(--fg); }
  nav button[aria-current="true"] { color: var(--fg); font-weight: 600; }
  nav button span { float: right; font-variant-numeric: tabular-nums; }
  main { padding: 32px; max-width: 920px; }
  main.all { max-width: 1100px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px 20px; }
  .grid[hidden], .row[hidden] { display: none; }
  .card { background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .card .t { font-size: 13px; margin-top: 2px; }
  .card .t span { color: var(--muted); float: right; }
  .card:hover .t { color: var(--accent); }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .note { color: var(--muted); margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  svg { width: 100%; height: auto; display: block; }
  .ctl { margin-top: 20px; display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .ctl input { width: 220px; accent-color: var(--accent); }
  .ctl[hidden] { display: none; }
  .ctl output { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3ch; }
  .unknowns { margin-top: 16px; color: var(--fg); }
  .fc { max-width: 520px; }
  .fc[hidden] { display: none; }
  .fcard { width: 100%; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 16px; font: inherit; color: inherit; cursor: pointer; text-align: left; min-height: 340px; }
  .fcard:hover { border-color: var(--accent); }
  .fcard .hint { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .fcard .nm { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .fcard .tx { color: var(--muted); }
  .pl { max-width: 780px; }
  .pl[hidden] { display: none; }
  .pl svg { touch-action: none; cursor: crosshair; border: 1px solid var(--line); border-radius: 8px; }
  .pl .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pl .tabs button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 4px 8px; cursor: pointer; }
  .pl .tabs button[aria-current="true"] { color: var(--fg); border-color: var(--accent); }
  .pl .math { margin-top: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pl .math b { color: var(--fg); font-weight: 600; }
  .game { max-width: 920px; }
  .gwrap { display: grid; grid-template-columns: minmax(0, 640px); gap: 24px; }
  .gwrap.two { grid-template-columns: 1fr 1fr; }
  .gwrap.two figure:first-child svg { pointer-events: none; }
  @media (max-width: 720px) { .gwrap.two { grid-template-columns: 1fr; } }
  .game svg { touch-action: none; cursor: crosshair; }
  .game[hidden] { display: none; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btns button { font: inherit; background: none; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .btns button:hover { border-color: var(--accent); color: var(--accent); }
  .btns button.go { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btns .sp { flex: 1; }
  .fb { margin-top: 14px; min-height: 3em; }
  .fb.ok { color: var(--moment); } .fb ul { margin: 4px 0 0; padding-left: 18px; color: var(--fg); }
  .fb .bad { color: #c0392b; font-weight: 600; }
  .ans[hidden] { display: none; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    nav button { display: inline-block; width: auto; margin-right: 12px; }
    nav button span { display: none; }
    main { padding: 16px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<nav id="nav" aria-label="Support type"></nav>
<main>
  <h1 id="title"></h1>
  <p class="note" id="note"></p>
  <div class="grid" id="grid" hidden></div>
  <div class="row" id="row">
    <figure><figcaption>Support</figcaption><svg id="a" viewBox="0 -10 320 250"></svg></figure>
    <figure><figcaption>Reaction</figcaption><svg id="b" viewBox="0 -10 320 250"></svg></figure>
  </div>
  <div class="pl" id="pl" hidden>
    <div class="tabs" id="pltabs"></div>
    <svg id="plsvg" viewBox="0 0 640 400"></svg>
    <div class="btns">
      <label style="display:flex;gap:6px;align-items:center;color:var(--muted)"><input type="checkbox" id="plres" checked> show resultants</label>
      <span class="sp"></span><button id="plclear">Remove pulleys</button><button id="plreset">Reset</button>
    </div>
    <div class="math" id="plmath"></div>
  </div>
  <div class="fc" id="fc" hidden>
    <button class="fcard" id="fcard"></button>
    <div class="btns">
      <button data-f="again">Again</button><button class="go" data-f="got">Got it</button>
      <span class="sp"></span><button data-f="shuffle">Shuffle</button>
    </div>
  </div>
  <div class="game" id="game" hidden>
    <div class="gwrap" id="gwrap">
      <figure><figcaption id="yours" hidden>Yours</figcaption><svg id="g" viewBox="0 -10 320 250"></svg></figure>
      <figure class="ans" id="ans" hidden><figcaption>Correct FBD</figcaption><svg id="ansv" viewBox="0 -10 320 250"></svg></figure>
    </div>
    <div class="btns">
      <button data-a="cw">↻ moment</button><button data-a="ccw">↺ moment</button>
      <button data-a="undo">Undo</button><button data-a="clear">Clear</button>
      <span class="sp"></span><button class="go" id="go" data-a="check">Check</button>
    </div>
    <div class="fb" id="fb"></div>
  </div>
  <label class="ctl" id="ctl">θ <input id="theta" type="range" min="15" max="75" value="35"><output id="out"></output></label>
  <div class="unknowns" id="unk"></div>
</main>

<script>
const rad = d => d * Math.PI / 180;
const J = [90, 160];             // where the member meets its support
const MEMBER_DEG = 22;           // member direction (up and to the right)

// ---- SVG helpers ----------------------------------------------------------
const line = (a, b, cls, extra = '') =>
  `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${cls ? `class="${cls}"` : ''} ${extra}/>`;
const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
const dir = d => [Math.cos(rad(d)), -Math.sin(rad(d))];   // screen coords, y down

function member(from, deg, len = 190) {
  const e = add(from, dir(deg), len);
  return `<g stroke="var(--member)" stroke-linecap="round">
    ${line(from, e, '', 'stroke-width="9"')}</g>
    <circle cx="${from[0]}" cy="${from[1]}" r="3.5" fill="var(--bg)" stroke="var(--ground)" stroke-width="1.5"/>`;
}
function hatch(a, b, side) {         // ground line with ticks, ticks go toward `side` (unit vector)
  let s = line(a, b, '', 'stroke="var(--ground)" stroke-width="2"');
  const n = 9, dx = (b[0] - a[0]) / n, dy = (b[1] - a[1]) / n;
  for (let i = 1; i <= n; i++) {
    const p = [a[0] + dx * i, a[1] + dy * i];
    s += line(p, add(p, side, 9), '', 'stroke="var(--ground)" stroke-width="1"');
    s = s.replace(/$/, '');
  }
  return s;
}
function arrow(from, to, label, color = 'var(--force)', faint = false) {
  const v = [to[0] - from[0], to[1] - from[1]], L = Math.hypot(...v), u = [v[0] / L, v[1] / L];
  const h = 11, base = add(to, u, -h), n = [-u[1], u[0]];
  const p1 = add(base, n, 4.5), p2 = add(base, n, -4.5);
  const mid = add(add(from, v, .5), n, 14);
  const lab = label ? `<text x="${mid[0] - 5}" y="${mid[1] + 5}" fill="${color}" font-size="15" font-style="italic" font-family="Georgia,serif">${label}</text>` : '';
  return `<g opacity="${faint ? .35 : 1}" ${faint ? 'stroke-dasharray="0"' : ''}>
    ${line(from, base, '', `stroke="${color}" stroke-width="2.5"`)}
    <polygon points="${to} ${p1} ${p2}" fill="${color}"/>${lab}</g>`;
}
function moment(c, label, ccw = false) {   // arc with arrowhead; clockwise by default (screen view)
  const r = 26, a0 = rad(205), a1 = rad(330);
  const pt = a => [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
  const st = pt(ccw ? a1 : a0), e = pt(ccw ? a0 : a1);
  const tan = ccw ? [Math.sin(a0), -Math.cos(a0)] : [-Math.sin(a1), Math.cos(a1)];
  const pr = [-tan[1], tan[0]];
  return `<path d="M${st} A${r} ${r} 0 0 ${ccw ? 0 : 1} ${e}" fill="none" stroke="var(--moment)" stroke-width="2.5"/>
    <polygon points="${add(e, tan, 10)} ${add(e, pr, 5)} ${add(e, pr, -5)}" fill="var(--moment)"/>
    ${label ? `<text x="${c[0] - r - 18}" y="${c[1] - 10}" fill="var(--moment)" font-size="15" font-style="italic" font-family="Georgia,serif">${label}</text>` : ''}`;
}
const dashed = (a, b) => line(a, b, '', 'stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"');
const pinBase = p => `<path d="M${p} l-12 20 h24 z" fill="none" stroke="var(--ground)" stroke-width="2"/>` +
                     hatch([p[0] - 18, p[1] + 20], [p[0] + 18, p[1] + 20], [0, 1]).replace(/stroke-width="1"/g, 'stroke-width="1"');

// ---- Support definitions -----------------------------------------------------
// Each gives { sup, rea, n, note, theta? }. th = angle in degrees (only when `theta` is true).
const S = [
  { name: 'Cable', n: 1, theta: true, note: 'Force acts along the cable, pulling away from the member.',
    draw(th) {
      const e = add(J, dir(MEMBER_DEG), 190), anchor = add(e, [-Math.cos(rad(th)), Math.sin(rad(th))], 125);
      const cable = line(e, anchor, '', 'stroke="#a8703a" stroke-width="3"');
      const gnd = hatch([anchor[0] - 22, anchor[1]], [anchor[0] + 22, anchor[1]], [0, 1]);
      return {
        sup: member(J, MEMBER_DEG) + pinBase(add(J, [0, 4])) + cable + gnd,
        rea: member(J, MEMBER_DEG) + arrow(e, add(e, [-Math.cos(rad(th)), Math.sin(rad(th))], 85), 'T') + dashed(e, add(e, [-1, 0], 70)),
      };
    } },
  { name: 'Link', n: 1, theta: true, note: 'Two-force member: the force acts along the link’s axis, either direction.',
    draw(th) {
      const e = add(J, dir(MEMBER_DEG), 190), anchor = add(e, [-Math.cos(rad(th)), Math.sin(rad(th))], 110);
      const link = line(e, anchor, '', 'stroke="#2f6fb5" stroke-width="7" stroke-linecap="round"');
      const u = [-Math.cos(rad(th)), Math.sin(rad(th))];
      return {
        sup: member(J, MEMBER_DEG) + pinBase(add(J, [0, 4])) + link + hatch([anchor[0] - 22, anchor[1] + 4], [anchor[0] + 22, anchor[1] + 4], [0, 1]),
        rea: member(J, MEMBER_DEG) + arrow(e, add(e, u, 85), 'F') + arrow(e, add(e, u, -85), '', 'var(--force)', true),
      };
    } },
  ...[
    ['Roller', 'Force acts perpendicular to the surface.'],
    ['Rocker', 'Force acts perpendicular to the surface.'],
    ['Frictionless surface', 'Force acts perpendicular to the contacting surface.'],
  ].map(([name, note]) => ({ name, n: 1, theta: true, note,
    draw(th) {
      const u = [Math.cos(rad(th)), Math.sin(rad(th))], nrm = [Math.sin(rad(th)), -Math.cos(rad(th))];
      const K = add(J, nrm, -(name === 'Frictionless surface' ? 0 : 9));
      const surf = hatch(add(K, u, -70), add(K, u, 105), [-nrm[0], -nrm[1]]);
      let ico = '';
      if (name === 'Roller') ico = [-1, 1].map(s => { const c = add(K, nrm, 4.5); return `<circle cx="${add(c, u, 13 * s)[0]}" cy="${add(c, u, 13 * s)[1]}" r="4.5" fill="#2f6fb5"/>`; }).join('') +
        `<circle cx="${add(K, nrm, 4.5)[0]}" cy="${add(K, nrm, 4.5)[1]}" r="4.5" fill="#2f6fb5"/>`;
      if (name === 'Rocker') ico = `<path d="M${add(K, u, -14)} A16 16 0 0 1 ${add(K, u, 14)} z" fill="#2f6fb5"/>`;
      const P = name === 'Frictionless surface' ? J : add(J, nrm, 0);
      return {
        sup: surf + member(P, MEMBER_DEG) + ico,
        rea: member(J, MEMBER_DEG) + dashed(add(K, u, -70), add(K, u, 90)) + arrow(add(K, nrm, -75), add(K, nrm, -2), 'N') ,
      };
    } })),
  { name: 'Roller in a slot', n: 1, theta: true, note: 'Force acts perpendicular to the slot; it can push from either side.',
    draw(th) {
      const u = [Math.cos(rad(th)), Math.sin(rad(th))], nrm = [Math.sin(rad(th)), -Math.cos(rad(th))];
      const lo = hatch(add(J, nrm, -12 - 0), add(add(J, nrm, -12), u, 105), [-nrm[0], -nrm[1]]);
      const loL = hatch(add(J, nrm, -12), add(add(J, nrm, -12), u, -75), [-nrm[0], -nrm[1]]);
      const hi = hatch(add(J, nrm, 12), add(add(J, nrm, 12), u, 105), [nrm[0], nrm[1]]);
      const hiL = hatch(add(J, nrm, 12), add(add(J, nrm, 12), u, -75), [nrm[0], nrm[1]]);
      return {
        sup: lo + loL + hi + hiL + member(J, MEMBER_DEG) + `<circle cx="${J[0]}" cy="${J[1]}" r="9" fill="#2f6fb5" fill-opacity=".6"/>`,
        rea: member(J, MEMBER_DEG) + arrow(add(J, nrm, -75), add(J, nrm, -2), 'N') + arrow(add(J, nrm, 75), add(J, nrm, 2), '', 'var(--force)', true),
      };
    } },
  { name: 'Pinned slider', n: 1, theta: true, note: 'Member pinned to a collar on a frictionless rod: force is perpendicular to the rod.',
    draw(th) {
      const u = [Math.cos(rad(th)), Math.sin(rad(th))], nrm = [Math.sin(rad(th)), -Math.cos(rad(th))];
      const rod = line(add(J, u, -75), add(J, u, 105), '', 'stroke="var(--ground)" stroke-width="3"');
      const collar = `<rect x="${J[0] - 12}" y="${J[1] - 8}" width="24" height="16" rx="3" fill="#2f6fb5" transform="rotate(${-th} ${J[0]} ${J[1]})"/>`;
      return {
        sup: rod + collar + member(J, MEMBER_DEG),
        rea: member(J, MEMBER_DEG) + dashed(add(J, u, -70), add(J, u, 110)) + arrow(add(J, nrm, -75), add(J, nrm, -2), 'N') + arrow(add(J, nrm, 75), add(J, nrm, 2), '', 'var(--force)', true),
      };
    } },
  { name: 'Fixed slider', n: 2, theta: true, note: 'Member fixed to a collar on a frictionless rod: a force perpendicular to the rod, and a couple moment.',
    draw(th) {
      const u = [Math.cos(rad(th)), Math.sin(rad(th))], nrm = [Math.sin(rad(th)), -Math.cos(rad(th))];
      const rod = line(add(J, u, -75), add(J, u, 105), '', 'stroke="var(--ground)" stroke-width="3"');
      const collar = `<rect x="${J[0] - 12}" y="${J[1] - 8}" width="24" height="16" rx="3" fill="#2f6fb5" transform="rotate(${-th} ${J[0]} ${J[1]})"/>`;
      const md = 90 + th;   // member perpendicular to rod
      return {
        sup: rod + collar + member(J, md, 120),
        rea: member(J, md, 120) + dashed(add(J, u, -70), add(J, u, 110)) + arrow(add(J, nrm, -75), add(J, nrm, -2), 'N') + moment(J, 'M'),
      };
    } },
  { name: 'Pin', n: 2, note: 'Force may have horizontal and vertical components (or a magnitude and a direction).',
    draw() {
      return {
        sup: member(J, MEMBER_DEG) + pinBase(add(J, [0, 4])),
        rea: member(J, MEMBER_DEG) + arrow(J, add(J, [0, -1], 80), 'Aᵧ') + arrow(J, add(J, [1, 0], 80), 'Aₓ'),
      };
    } },
  { name: 'Fixed support', n: 3, note: 'Resists translation and rotation: two force components and a couple moment.',
    draw() {
      const wall = hatch([J[0], J[1] - 40], [J[0], J[1] + 40], [-1, 0]);
      return {
        sup: wall + member(J, MEMBER_DEG).replace(/<circle[^>]*\/>/, ''),
        rea: member(J, MEMBER_DEG).replace(/<circle[^>]*\/>/, '') + arrow(J, add(J, [0, -1], 80), 'Aᵧ') + arrow(J, add(J, [1, 0], 80), 'Aₓ') + moment(J, 'M'),
      };
    } },
];

// ---- Practice rules ------------------------------------------------------
const E_PT = () => add(J, dir(MEMBER_DEG), 190);
const unit = v => { const L = Math.hypot(...v); return [v[0] / L, v[1] / L]; };
const angBetween = (a, b) => Math.acos(Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1]))) * 180 / Math.PI;
const TOL = 14, NEAR = 30;

function ruleFor(name, th) {
  const nrm = [Math.sin(rad(th)), -Math.cos(rad(th))];
  const toAnchor = [-Math.cos(rad(th)), Math.sin(rad(th))];
  switch (name) {
    case 'Cable': return { pt: E_PT(), dirs: [toAnchor], both: false, hint: 'A cable can only pull: the force acts along the cable, away from the member.' };
    case 'Link': return { pt: E_PT(), dirs: [toAnchor], both: true, hint: 'A link is a two-force member: the force acts along the link’s axis (either direction).' };
    case 'Roller': case 'Rocker': case 'Frictionless surface':
      return { pt: J, dirs: [nrm], both: false, hint: 'The surface can only push: the force is perpendicular to the surface, pointing into the member.' };
    case 'Roller in a slot': case 'Pinned slider':
      return { pt: J, dirs: [nrm], both: true, hint: 'The force is perpendicular to the slot/rod (either side).' };
    case 'Fixed slider': return { pt: J, dirs: [nrm], both: true, moment: true, hint: 'A force perpendicular to the rod, plus a couple moment.' };
    case 'Pin': return { pt: J, free: true, hint: 'Pin: two unknowns, Aₓ and Aᵧ (or one force with unknown magnitude and direction).' };
    case 'Fixed support': return { pt: J, free: true, moment: true, hint: 'Fixed support: Aₓ, Aᵧ and a couple moment M.' };
  }
}

function grade(name, th, items) {
  const R = ruleFor(name, th), msgs = [];
  const arrows = items.filter(x => x.t === 'f'), moms = items.filter(x => x.t === 'm');
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  if (arrows.some(a => dist(a.a, R.pt) > NEAR && dist(a.b, R.pt) > NEAR))
    msgs.push('Each force must start or end at the point where the support acts on the member.');
  const vecs = arrows.map(a => unit([a.b[0] - a.a[0], a.b[1] - a.a[1]]));
  if (R.free) {
    const axis = (v, d) => Math.min(angBetween(v, d), angBetween(v, [-d[0], -d[1]])) <= TOL;
    const two = vecs.length === 2 && ((axis(vecs[0], [1, 0]) && axis(vecs[1], [0, 1])) || (axis(vecs[0], [0, 1]) && axis(vecs[1], [1, 0])));
    if (!(vecs.length === 1 || two)) msgs.push('Draw either one force at any angle, or two components: one horizontal (Aₓ) and one vertical (Aᵧ).');
  } else {
    if (vecs.length !== 1) msgs.push(`This support has exactly 1 force unknown; you drew ${vecs.length}.`);
    else {
      const v = vecs[0], d = R.dirs[0], neg = [-d[0], -d[1]];
      const onAxis = Math.min(angBetween(v, d), angBetween(v, neg)) <= TOL;
      if (!onAxis) msgs.push('Wrong line of action. ' + R.hint);
      else if (!R.both && angBetween(v, d) > TOL) msgs.push('Right line, wrong sense. ' + R.hint);
    }
  }
  if (R.moment && moms.length !== 1) msgs.push('This support also resists rotation: add one couple moment.');
  if (!R.moment && moms.length) msgs.push('This support cannot resist rotation: no couple moment.');
  if (R.moment && moms.length > 1) msgs.push('Only one couple moment is needed.');
  return msgs;
}

// ---- UI ----------------------------------------------------------------
const $ = id => document.getElementById(id);
const hashToCur = h => h === '#all' ? -1 : h === '#practice' ? -2 : h === '#flashcards' ? -3 : h === '#pulleys' ? -4 : (Number(h.slice(1)) || 0);
let cur = hashToCur(location.hash);
if (cur < -4 || cur >= S.length) cur = 0;
const setCur = i => { cur = i; location.hash = i === -1 ? 'all' : i === -2 ? 'practice' : i === -3 ? 'flashcards' : i === -4 ? 'pulleys' : i; render(); };

$('nav').innerHTML = '<button data-i="-4">Pulleys</button><button data-i="-3">Flashcards</button><button data-i="-2">Practice</button><button data-i="-1">All</button>' +
  S.map((s, i) => `<button data-i="${i}">${s.name}<span>${s.n}</span></button>`).join('');
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) setCur(+b.dataset.i); };
$('theta').oninput = render;
$('grid').onclick = e => { const b = e.target.closest('button'); if (b) setCur(+b.dataset.i); };

// ---- Pulleys -----------------------------------------------------------------
// Ideal rope: the same tension T everywhere. Arrows show the force the rope exerts on whatever it touches.
const ROPE = '#a8703a', ARR = 46;
const stem = (x, y1, y2) => line([x, y1], [x, y2], '', 'stroke="var(--ground)" stroke-width="2"');
const PU = { A: [0, 0], H: [0, 0], ps: [], aLoad: false, ceil: false, preset: 'Sandbox', res: true, drag: null };
const P = (x, y, o = {}) => ({ c: [x, y], r: 24, flip: false, load: false, ...o });
const PRESETS = {
  'Sandbox': () => ({ A: [110, 60], H: [560, 320], aLoad: false, ceil: false,
    ps: [P(280, 210), P(430, 110)] }),
  'MA 2': () => ({ A: [241, 104], H: [140, 140], aLoad: false, ceil: true,
    ps: [P(265, 250, { load: true }), P(265, 60)] }),
  'MA 3': () => ({ A: [280, 224], H: [160, 130], aLoad: true, ceil: true,
    ps: [P(270, 150, { r: 18 }), P(280, 250, { r: 26, load: true }), P(300, 60, { r: 26 })] }),
  'MA 4': () => ({ A: [205, 104], H: [397, 170], aLoad: false, ceil: true,
    ps: [P(229, 250, { load: true }), P(277, 60), P(325, 250, { load: true }), P(373, 60)] }),
};
function puLoad(name) { Object.assign(PU, PRESETS[name](), { preset: name }); }
puLoad('MA 2');

function ropeGeom() {
  const nodes = [{ c: PU.A, r: 0, s: 0 }, ...PU.ps.map(p => ({ c: p.c, r: p.r, s: 0, p })), { c: PU.H, r: 0, s: 0 }];
  for (let i = 1; i < nodes.length - 1; i++) {
    const a = nodes[i - 1].c, c = nodes[i].c, b = nodes[i + 1].c;
    const cr = (c[0] - a[0]) * (b[1] - c[1]) - (c[1] - a[1]) * (b[0] - c[0]);   // >0 = clockwise on screen
    nodes[i].s = (cr >= 0 ? 1 : -1) * (nodes[i].p.flip ? -1 : 1);
  }
  const segs = [];
  for (let i = 0; i < nodes.length - 1; i++) {
    const a = nodes[i], b = nodes[i + 1], D = [b.c[0] - a.c[0], b.c[1] - a.c[1]], L = Math.hypot(...D) || 1;
    const k = Math.max(-1, Math.min(1, -(b.s * b.r - a.s * a.r) / L));
    const phi = Math.atan2(D[1], D[0]) + Math.asin(k), d = [Math.cos(phi), Math.sin(phi)], n = [d[1], -d[0]];
    segs.push({ d, p1: add(a.c, n, a.s * a.r), p2: add(b.c, n, b.s * b.r) });
  }
  return { nodes, segs };
}

function drawPulleys() {
  const { nodes, segs } = ropeGeom(), n = nodes.length;
  const loadPs = PU.ps.filter(p => p.load);
  let svg = '', d = `M${segs[0].p1} L${segs[0].p2}`;
  // ceiling and fixed mounts
  if (PU.ceil) {
    svg += hatch([40, 14], [600, 14], [0, -1]);
    PU.ps.filter(p => !p.load).forEach(p => svg += stem(p.c[0], 14, p.c[1]));
    if (!PU.aLoad) svg += stem(PU.A[0], 14, PU.A[1]);
  }
  // hanging load
  const grp = [...loadPs.map(p => p.c), ...(PU.aLoad ? [PU.A] : [])];
  let fbd = null;
  if (grp.length) {
    const cx = grp.reduce((t, c) => t + c[0], 0) / grp.length;
    const bot = Math.max(...loadPs.map(p => p.c[1] + p.r), PU.aLoad ? PU.A[1] + 4 : 0) + 4;
    const xs = [...loadPs.map(p => p.c[0] - p.r), ...loadPs.map(p => p.c[0] + p.r)];
    if (loadPs.length) svg += line([Math.min(...xs), bot], [Math.max(...xs), bot], '', 'stroke="var(--member)" stroke-width="6" stroke-linecap="round"');
    svg += stem(cx, bot, bot + 22) +
      `<rect x="${cx - 26}" y="${bot + 22}" width="52" height="38" rx="4" fill="var(--member)"/>
       <text x="${cx}" y="${bot + 46}" text-anchor="middle" font-size="14" fill="var(--bg)" font-family="Georgia,serif" font-style="italic">w</text>` +
      arrow([cx, bot + 60], [cx, bot + 60 + 50], 'w');
    fbd = { cx };
  }
  // rope
  nodes.slice(1, -1).forEach(nd => {
    svg += `<circle cx="${nd.c[0]}" cy="${nd.c[1]}" r="${nd.r}" fill="var(--bg)" stroke="var(--ground)" stroke-width="2"/>`;
  });
  for (let i = 1; i < n - 1; i++) {
    const c = nodes[i].c, sg = nodes[i].s, r = nodes[i].r, pin = segs[i - 1].p2, pout = segs[i].p1;
    const ti = Math.atan2(pin[1] - c[1], pin[0] - c[0]), to = Math.atan2(pout[1] - c[1], pout[0] - c[0]);
    let dl = (sg * (to - ti)) % (2 * Math.PI); if (dl < 0) dl += 2 * Math.PI;
    d += ` A${r} ${r} 0 ${dl > Math.PI ? 1 : 0} ${sg === 1 ? 1 : 0} ${pout} L${segs[i].p2}`;
  }
  svg += `<path d="${d}" fill="none" stroke="${ROPE}" stroke-width="3.5" stroke-linejoin="round"/>`;
  nodes.slice(1, -1).forEach((nd, i) => {
    svg += `<circle cx="${nd.c[0]}" cy="${nd.c[1]}" r="3" fill="var(--ground)"/>`;
  });
  svg += `<rect x="${PU.A[0] - 7}" y="${PU.A[1] - 7}" width="14" height="14" fill="${PU.aLoad ? 'var(--member)' : 'var(--ground)'}"/>
          <circle cx="${PU.H[0]}" cy="${PU.H[1]}" r="6" fill="var(--ground)"/>`;
  // tension arrows
  const dirsOnLoad = [];
  svg += arrow(PU.A, add(PU.A, segs[0].d, ARR), 'T');
  if (PU.aLoad) dirsOnLoad.push(segs[0].d);
  svg += arrow(PU.H, add(PU.H, segs[n - 2].d, -ARR), 'T');
  const rows = [];
  for (let i = 1; i < n - 1; i++) {
    const din = segs[i - 1].d, dout = segs[i].d, mdin = [-din[0], -din[1]];
    svg += arrow(segs[i - 1].p2, add(segs[i - 1].p2, mdin, ARR), 'T') + arrow(segs[i].p1, add(segs[i].p1, dout, ARR), 'T');
    if (nodes[i].p.load) dirsOnLoad.push(mdin, dout);
    const res = [dout[0] - din[0], dout[1] - din[1]], m = Math.hypot(...res);
    if (PU.res && m > 0.02) svg += arrow(nodes[i].c, add(nodes[i].c, res, ARR), 'R', 'var(--moment)');
    const ang = (Math.round(Math.atan2(-res[1], res[0]) * 180 / Math.PI) + 360) % 360;
    rows.push(`<div>Pulley ${i}${nodes[i].p.load ? ' (on load)' : ''}: <b>R = ${m.toFixed(2)} T</b>${m > 0.02 ? ` at ${ang}°` : ''}</div>`);
  }
  // free body diagram of the load
  let head = '';
  if (fbd) {
    const o = [560, 130], up = dirsOnLoad.reduce((t, v) => t - v[1], 0);
    svg += `<text x="${o[0] - 60}" y="${o[1] - 70}" font-size="12" fill="var(--muted)">FBD of the load</text>`;
    dirsOnLoad.forEach((v, k) => { const q = [o[0] + (k - (dirsOnLoad.length - 1) / 2) * 18, o[1]]; svg += arrow(q, add(q, v, 42), 'T'); });
    svg += arrow(o, add(o, [0, 1], 42 * up), 'w') + `<circle cx="${o[0]}" cy="${o[1]}" r="4" fill="var(--ground)"/>`;
    const T = dirsOnLoad.length;
    head = `<div><b>${T} rope strands</b> pull up on the load: ΣF<sub>y</sub> = 0 → ${up.toFixed(2)}·T = w → <b>T = w / ${up.toFixed(2)}</b>, mechanical advantage ≈ <b>${up.toFixed(2)}</b></div>`;
  }
  $('plsvg').innerHTML = svg;
  $('note').textContent = 'Click empty space to add a pulley · drag to move · click a pulley to flip its wrap · shift-click to put a pulley on the load · double-click to remove.';
  $('plmath').innerHTML = head + `<div>Purple T: force the rope exerts on whatever it touches (same T everywhere). Green R: net force on a pulley’s axle.</div>` + rows.join('');
  document.querySelectorAll('#pltabs button').forEach(b => b.setAttribute('aria-current', b.dataset.n === PU.preset));
}

$('pltabs').innerHTML = Object.keys(PRESETS).map(k => `<button data-n="${k}">${k}</button>`).join('');
$('pltabs').onclick = e => { const b = e.target.closest('button'); if (b) { puLoad(b.dataset.n); drawPulleys(); } };

function puPt(e) {
  const svg = $('plsvg'), q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY;
  const r = q.matrixTransform(svg.getScreenCTM().inverse()); return [r.x, r.y];
}
function puHit(pt) {
  const dist = c => Math.hypot(pt[0] - c[0], pt[1] - c[1]);
  if (dist(PU.A) < 14) return { k: 'A' };
  if (dist(PU.H) < 14) return { k: 'H' };
  for (let i = PU.ps.length - 1; i >= 0; i--) if (dist(PU.ps[i].c) < PU.ps[i].r + 4) return { k: 'p', i };
  return { k: 'empty' };
}
function puInsert(pt) {            // put the new pulley where it adds the least rope
  const pts = [PU.A, ...PU.ps.map(p => p.c), PU.H], dd = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let best = 0, bc = Infinity;
  for (let i = 0; i < pts.length - 1; i++) { const c = dd(pts[i], pt) + dd(pt, pts[i + 1]) - dd(pts[i], pts[i + 1]); if (c < bc) { bc = c; best = i; } }
  PU.ps.splice(best, 0, P(pt[0], pt[1]));
}
$('plsvg').addEventListener('pointerdown', e => {
  const pt = puPt(e); PU.drag = { ...puHit(pt), start: pt, moved: false, shift: e.shiftKey };
  $('plsvg').setPointerCapture(e.pointerId);
});
$('plsvg').addEventListener('pointermove', e => {
  const g = PU.drag; if (!g || g.k === 'empty') return;
  const pt = puPt(e); if (Math.hypot(pt[0] - g.start[0], pt[1] - g.start[1]) > 4) g.moved = true;
  if (!g.moved) return;
  const c = [Math.max(10, Math.min(630, pt[0])), Math.max(10, Math.min(390, pt[1]))];
  if (g.k === 'A') PU.A = c; else if (g.k === 'H') PU.H = c; else PU.ps[g.i].c = c;
  drawPulleys();
});
$('plsvg').addEventListener('pointerup', e => {
  const g = PU.drag; PU.drag = null; if (!g) return;
  if (g.k === 'empty') puInsert(puPt(e));
  else if (!g.moved && g.k === 'p') { const p = PU.ps[g.i]; if (g.shift) p.load = !p.load; else p.flip = !p.flip; }
  else if (!g.moved && g.k === 'A' && g.shift) PU.aLoad = !PU.aLoad;
  drawPulleys();
});
$('plsvg').addEventListener('dblclick', e => {
  const h = puHit(puPt(e)); if (h.k === 'p') { PU.ps.splice(h.i, 1); drawPulleys(); }
});
$('plres').onchange = e => { PU.res = e.target.checked; drawPulleys(); };
$('plclear').onclick = () => { PU.ps = []; PU.aLoad = false; drawPulleys(); };
$('plreset').onclick = () => { puLoad(PU.preset); drawPulleys(); };

// ---- Flashcards ------------------------------------------------------------
const F = { deck: [], flipped: false, known: 0, total: S.length };
function shuffleDeck() {
  F.deck = S.map((_, i) => i).sort(() => Math.random() - .5); F.flipped = false; F.known = 0;
}
function drawCard() {
  const el = $('fcard');
  if (!F.deck.length) {
    el.innerHTML = `<div class="nm">Deck done</div><p class="tx">You got all ${F.total} cards. Shuffle to go again.</p>`;
    return;
  }
  const s = S[F.deck[0]], r = s.draw(35);
  const left = `${F.known}/${F.total} known`;
  el.innerHTML = F.flipped
    ? `<div class="hint">Answer · ${left}</div><div class="nm">${s.name} · ${s.n} unknown${s.n > 1 ? 's' : ''}</div>
       <svg viewBox="0 -10 320 250">${r.rea}</svg><div class="tx">${s.note}</div>`
    : `<div class="hint">What is the reaction? How many unknowns? · ${left}</div>
       <svg viewBox="0 -10 320 250">${r.sup}</svg><div class="tx">Click to flip</div>`;
}
$('fcard').onclick = () => { if (F.deck.length) { F.flipped = !F.flipped; drawCard(); } };
document.querySelector('.fc .btns').onclick = e => {
  const a = e.target.dataset.f; if (!a) return;
  if (a === 'shuffle') shuffleDeck();
  else if (F.deck.length) {
    const c = F.deck.shift(); F.flipped = false;
    if (a === 'got') F.known++;
    else F.deck.splice(Math.min(3, F.deck.length), 0, c);   // see it again soon
  }
  drawCard();
};
shuffleDeck();

// ---- Practice game -------------------------------------------------------
const G = { q: null, items: [], done: false, score: 0, tries: 0, streak: 0, drag: null };

function newQuestion() {
  const si = Math.floor(Math.random() * S.length);
  G.q = { si, th: 20 + Math.floor(Math.random() * 11) * 5 };
  G.items = []; G.done = false; G.drag = null;
  $('fb').textContent = ''; $('fb').className = 'fb'; $('ans').hidden = true; $('yours').hidden = true; $('gwrap').classList.remove('two');
  $('go').textContent = 'Check'; $('go').dataset.a = 'check';
  drawGame();
}

function drawGame() {
  const { si, th } = G.q, s = S[si], R = ruleFor(s.name, th);
  let svg = s.draw(th).sup;
  svg += `<circle cx="${R.pt[0]}" cy="${R.pt[1]}" r="14" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${R.pt[0] + 16}" y="${R.pt[1] - 12}" font-size="14" fill="var(--muted)" font-family="Georgia,serif" font-style="italic">A</text>`;
  svg += G.items.map(x => x.t === 'f' ? arrow(x.a, x.b, '') : moment(R.pt, '', x.ccw)).join('');
  if (G.drag) svg += `<g opacity=".5">${arrow(G.drag.a, G.drag.b, '')}</g>`;
  $('g').innerHTML = svg;
  const who = s.theta ? ` (θ = ${th}°)` : '';
  $('note').textContent = `Draw the reaction(s) the ${s.name.toLowerCase()} exerts on the member at A${who}. Drag to draw an arrow.` +
    (G.tries ? `   ·   ${G.score}/${G.tries}, streak ${G.streak}` : '');
}

function svgPt(e) {
  const svg = $('g'), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y];
}
$('g').addEventListener('pointerdown', e => {
  if (G.done) return;
  const R = ruleFor(S[G.q.si].name, G.q.th);
  let a = svgPt(e);
  if (Math.hypot(a[0] - R.pt[0], a[1] - R.pt[1]) < NEAR) a = R.pt;   // snap to the point
  G.drag = { a, b: a }; $('g').setPointerCapture(e.pointerId); drawGame();
});
$('g').addEventListener('pointermove', e => {
  if (!G.drag) return;
  const R = ruleFor(S[G.q.si].name, G.q.th); let b = svgPt(e);
  if (Math.hypot(b[0] - R.pt[0], b[1] - R.pt[1]) < NEAR) b = R.pt;
  G.drag.b = b; drawGame();
});
$('g').addEventListener('pointerup', () => {
  if (!G.drag) return;
  const { a, b } = G.drag; G.drag = null;
  if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 25) G.items.push({ t: 'f', a, b });
  drawGame();
});

document.querySelector('.game .btns').onclick = e => {
  const a = e.target.dataset.a; if (!a) return;
  if (a === 'next') return newQuestion();
  if (G.done) return;
  if (a === 'cw' || a === 'ccw') G.items.push({ t: 'm', ccw: a === 'ccw' });
  if (a === 'undo') G.items.pop();
  if (a === 'clear') G.items = [];
  if (a === 'check') {
    const { si, th } = G.q, s = S[si], msgs = grade(s.name, th, G.items);
    G.done = true; G.tries++;
    if (msgs.length) { G.streak = 0; $('fb').className = 'fb'; $('fb').innerHTML = '<span class="bad">Not quite</span><ul>' + msgs.map(m => `<li>${m}</li>`).join('') + '</ul>'; }
    else { G.score++; G.streak++; $('fb').className = 'fb ok'; $('fb').textContent = 'Correct. ' + ruleFor(s.name, th).hint; }
    $('ansv').innerHTML = s.draw(th).rea; $('ans').hidden = false; $('yours').hidden = false; $('gwrap').classList.add('two');
    $('go').textContent = 'Next'; $('go').dataset.a = 'next';
  }
  drawGame();
};

function render() {
  const th = +$('theta').value;
  const all = cur === -1, prac = cur === -2;
  const fc = cur === -3;
  $('grid').hidden = !all; $('row').hidden = all || prac || fc || cur === -4; $('game').hidden = !prac; $('fc').hidden = cur !== -3; $('pl').hidden = cur !== -4;
  document.querySelector('main').classList.toggle('all', all);
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', +b.dataset.i === cur));
  $('out').textContent = th + '°';
  if (cur === -4) {
    $('title').textContent = 'Pulleys';
    $('ctl').hidden = true; $('unk').textContent = ''; drawPulleys();
    return;
  }
  if (fc) {
    $('title').textContent = 'Flashcards';
    $('note').textContent = 'Look at the support, say its reaction out loud, then flip.';
    $('ctl').hidden = true; $('unk').textContent = ''; drawCard();
    return;
  }
  if (prac) {
    $('title').textContent = 'Practice';
    $('ctl').hidden = true; $('unk').textContent = '';
    if (!G.q) newQuestion(); else drawGame();
    return;
  }
  if (all) {
    $('title').textContent = 'All reactions';
    $('note').textContent = 'Same member, same θ. Click one to open it.';
    $('ctl').hidden = false; $('unk').textContent = '';
    $('grid').innerHTML = S.map((s, i) => `<button class="card" data-i="${i}"><svg viewBox="0 -10 320 250">${s.draw(th).rea}</svg><div class="t">${s.name}<span>${s.n}</span></div></button>`).join('');
    return;
  }
  const s = S[cur];
  const r = s.draw(th);
  $('a').innerHTML = r.sup;
  $('b').innerHTML = r.rea;
  $('title').textContent = s.name;
  $('note').textContent = s.note;
  $('ctl').hidden = !s.theta;
  $('unk').textContent = s.n + (s.n === 1 ? ' unknown' : ' unknowns');
}
render();
</script>
</body>
</html>
