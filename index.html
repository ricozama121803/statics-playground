    const x1 = dx * t, y2 = t - cam.dist, z2 = dy * t;
    const y1 = cp * y2 + sp * z2;
    return [cy * x1 + sy_ * y1 + cam.tx, -sy_ * x1 + cy * y1 + cam.ty, z0];
  }
  const seg3 = (g, a, b, c, lw, dash) => { const p = proj(a), q = proj(b); line(g, p.x, p.y, q.x, q.y, c, lw, dash); };

  function draw(g, w, h) {
    cam.cx = w / 2; cam.cy = h * 0.5; cam.f = Math.min(w, h) * 1.1;
    const s = solve(), hide = app.hideSolution;
    // floor grid
    for (let i = -5; i <= 5; i++) { seg3(g, [i, -5, 0], [i, 5, 0], COL.grid, 1); seg3(g, [-5, i, 0], [5, i, 0], COL.grid, 1); }
    // axes
    const ao = [-5, 5, 0];
    [['x', [2, 0, 0]], ['y', [0, 2, 0]], ['z', [0, 0, 2]]].forEach(([n, v]) => {
      const e = v3.add(ao, v);
      seg3(g, ao, e, COL.muted, 1.8);
      const p = proj(e); text(g, n, p.x + 8, p.y - 6, COL.muted, { size: 12, bold: true });
    });
    hs = [];
    const P = S.P, pp = proj(P);
    // drop lines + shadows
    const drop = (p, c) => { seg3(g, p, [p[0], p[1], 0], c, 1, [3, 4]); const q = proj([p[0], p[1], 0]); disc(g, q.x, q.y, 3, c); };
    S.A.forEach(a => drop(a, COL.muted)); drop(P, COL.muted);

    // cables
    S.A.forEach((a, i) => {
      const ap = proj(a), t = s ? s.T[i] : NaN, bad = !hide && (!s || !s.ok || t < 0);
      line(g, ap.x, ap.y, pp.x, pp.y, bad ? COL.warn : COL.tension, hide ? 3 : bad ? 2.5 : clamp(2 + Math.abs(t) / Math.max(S.W, 40) * 1.6, 2.5, 6.5), bad ? [7, 5] : null);
      g.save(); g.fillStyle = COL.ink; g.fillRect(ap.x - 7, ap.y - 7, 14, 14); g.restore();
      text(g, `A${SUBN[i + 1]}`, ap.x + 12, ap.y - 12, COL.ink, { bold: true });
      const lt = 0.4, lx = ap.x + (pp.x - ap.x) * lt, ly = ap.y + (pp.y - ap.y) * lt;
      if (s && s.ok && !hide) text(g, `T${SUBN[i + 1]} = ${fmt(t, 1)} N`, lx + (pp.x >= ap.x ? 8 : -8), ly, bad ? COL.warn : COL.tension, { bold: true, size: 13, align: pp.x >= ap.x ? 'left' : 'right' });
      hs.push({ key: 'A' + i, x: ap.x, y: ap.y, r: 13, d: ap.d });
      if (!app.locked) handleDot(g, ap.x, ap.y, COL.ink, drag === 'A' + i);
    });

    // force vectors at P
    if (S.vec) {
      const a3 = (dir, len, c, lab) => {
        const e = v3.add(P, v3.mul(dir, Math.min(len, 5))), q = proj(e);
        arrow(g, pp.x, pp.y, q.x, q.y, c, 3, 11); if (lab) text(g, lab, q.x + 8, q.y + 4, c, { bold: true, size: 12 });
      };
      a3([0, 0, -1], S.W * FS, COL.force, `W = ${fmt(S.W, 0)} N`);
      if (Math.abs(S.Fx) > 0) a3([Math.sign(S.Fx), 0, 0], Math.abs(S.Fx) * FS, COL.force, `Fx = ${fmt(S.Fx, 0)}`);
      if (Math.abs(S.Fy) > 0) a3([0, Math.sign(S.Fy), 0], Math.abs(S.Fy) * FS, COL.force, `Fy = ${fmt(S.Fy, 0)}`);
    }
    // load block + knot
    g.save(); g.fillStyle = COL.force; g.globalAlpha = 0.2; const bl = 14; g.fillRect(pp.x - bl, pp.y + 6, bl * 2, bl * 1.6); g.globalAlpha = 1; g.strokeStyle = COL.force; g.lineWidth = 2; g.strokeRect(pp.x - bl, pp.y + 6, bl * 2, bl * 1.6); g.restore();
    handleDot(g, pp.x, pp.y, COL.ink, drag === 'P');
    hs.push({ key: 'P', x: pp.x, y: pp.y, r: 13, d: pp.d });
    text(g, 'P', pp.x - 14, pp.y - 12, COL.ink, { bold: true });

    if (hide) text(g, 'T₁ = ?   T₂ = ?   T₃ = ?', w / 2, 40, COL.tension, { bold: true, align: 'center' });
    else if (s && !s.ok) text(g, 'Cables are coplanar: the 3×3 system is singular.', w / 2, 40, COL.warn, { bold: true, align: 'center' });
    else if (s && s.T.some(t => t < 0)) text(g, 'Negative tension: that cable would have to push, so the configuration cannot hold.', w / 2, 40, COL.warn, { bold: true, align: 'center' });
    text(g, 'drag empty space to orbit · wheel to zoom', w - 12, h - 14, COL.muted, { size: 11.5, align: 'right', halo: false });
  }

  const clampPos = (p, isP) => [clamp(p[0], -5, 5), clamp(p[1], -5, 5), clamp(p[2], isP ? 0.2 : 0.5, isP ? 6 : 8)];
  function target(key) { return key === 'P' ? S.P : S.A[+key[1]]; }
  function setTarget(key, v) { if (key === 'P') S.P = clampPos(v, true); else S.A[+key[1]] = clampPos(v, false); }

  return {
    id: 'tripod', title: '3D Cables',
    blurb: `<h2>Three-cable tension in 3D</h2><p>A load hangs at P from three cables. Write each cable's direction as a unit vector <b>û</b><sub>i</sub> = (A<sub>i</sub> − P)/|A<sub>i</sub> − P|. Equilibrium <b>ΣF = 0</b> gives three scalar equations (x, y, z) for the three tensions: a 3×3 linear system.</p>
    <ul><li>Drag anchors and P across the floor plane. Switch to "vertical" to change their height.</li><li>Orbit the view: drag empty space. Zoom with the wheel.</li><li>Push P outside the anchors' footprint: a tension goes negative (slack cable).</li></ul>`,
    hint: 'Drag anchors / P · drag empty space to orbit',
    controls: [
      { id: 'W', label: 'Weight W', min: 10, max: 200, step: 10, unit: 'N', get: () => S.W, set: v => S.W = v },
      { id: 'Fx', label: 'Side load Fx', min: -50, max: 50, step: 5, unit: 'N', get: () => S.Fx, set: v => S.Fx = v },
      { id: 'Fy', label: 'Side load Fy', min: -50, max: 50, step: 5, unit: 'N', get: () => S.Fy, set: v => S.Fy = v },
      { id: 'plane', type: 'seg', label: 'Drag', options: [['h', 'horizontal'], ['v', 'vertical']], get: () => S.vert ? 'v' : 'h', set: v => S.vert = v === 'v', free: true },
      { id: 'vec', type: 'toggle', label: 'Force vectors', get: () => S.vec, set: v => S.vec = v, free: true },
      { id: 'snap', type: 'toggle', label: 'Snap', get: () => app.snap, set: v => app.snap = v, free: true },
      { id: 'rst', type: 'button', label: 'Reset', onClick: reset }
    ],
    reset, draw,
    challenges: [
      { name: 'Equalise the tensions', make() {
        reset(); S.W = rnd([90, 120, 150]);
        S.P = [rnd([-1.5, -1, 1, 1.5]), rnd([-1.5, -1, 1, 1.5]), 1.5];
        return { kind: 'target',
          prompt: `The knot has been pushed off-centre. Move P (or the anchors) so that <b>all three tensions are equal</b> (within 3%).`,
          hint: `By symmetry, equal tensions occur when P sits directly below the centroid of an equilateral anchor triangle.`,
          ok: () => { const s = solve(); if (!s || !s.ok || s.T.some(t => t <= 0)) return false; const m = (s.T[0] + s.T[1] + s.T[2]) / 3; return Math.max(...s.T) - Math.min(...s.T) <= 0.03 * m; },
          status: () => { const s = solve(); return s && s.ok ? `T₁ = ${fmt(s.T[0])}, T₂ = ${fmt(s.T[1])}, T₃ = ${fmt(s.T[2])} N` : 'No solution'; } };
      } },
      { name: 'Lighten the load', make() {
        reset(); S.W = rnd([90, 120, 150]);
        return { kind: 'target',
          prompt: `Right now each cable carries about 57% of W. Rearrange the anchors or P so that <b>every tension is below 0.5 W = ${fmt(S.W / 2, 0)} N</b>.`,
          hint: `Steeper cables carry less: for the symmetric case T = W / (3 sin θ). Raise the anchors or lower P (use vertical drag).`,
          ok: () => { const s = solve(); return !!s && s.ok && s.T.every(t => t > 0 && t < S.W / 2); },
          status: () => { const s = solve(); return s && s.ok ? `max T = ${fmt(Math.max(...s.T))} N (limit ${fmt(S.W / 2, 0)} N)` : 'No solution'; } };
      } },
      { name: 'Symmetric tripod', make() {
        const [rho, h] = rnd([[3, 4], [4, 3], [1.5, 2], [2, 1.5]]);
        reset(); S.W = rnd([60, 90, 120, 150, 180]); equil(rho, h, 1.5);
        return { kind: 'answer', unit: 'N',
          prompt: `Three identical cables are spaced 120° apart. Each anchor is ${fmt(rho, 1)} m horizontally and ${fmt(h, 1)} m vertically from P. Find the tension <b>T</b> in each cable, in newtons (W = ${fmt(S.W, 0)} N).`,
          hint: `By symmetry all tensions are equal. The horizontal parts cancel; only the vertical parts support W: 3·T·sin θ = W, where sin θ = height / cable length.`,
          answer: () => solve().T[0], tolAbs: 0.6, tolRel: 0.01 };
      } }
    ],
    equations() {
      const s = solve(), A = S.A, P = S.P;
      if (!s) return { setup: ROW('Geometry', 'A cable has zero length.'), solution: '' };
      const v = a => `(${a.map(x => fmt(x, 2)).join(', ')})`;
      let setup = ROW('Points (m)', `${I('P')} = ${v(P)}<br>` + A.map((a, i) => `${SB('A', i + 1)} = ${v(a)}`).join('<br>')) +
        ROW('Load', `${I('W')} = ${fmt(S.W, 0)} N ↓` + (S.Fx || S.Fy ? `, side load (${fmt(S.Fx, 0)}, ${fmt(S.Fy, 0)}) N` : '')) +
        ROW('Unit vectors', `${I('û')}<sub>i</sub> = (${SB('A', 'i')} − ${I('P')}) / |${SB('A', 'i')} − ${I('P')}|<br>` +
          s.u.map((u, i) => `${I('û')}<sub>${i + 1}</sub> = ${v(u).replace(/\.(\d\d)/g, '.$1')} &nbsp;<span style="font-size:.8em;color:var(--muted)">(length ${fmt(s.l[i], 2)} m)</span>`).join('<br>'));
      const pad = (x, n = 6) => fmt(x, 2).padStart(n);
      const rows = [0, 1, 2].map(r => `${pad(s.m[r][0])} ${pad(s.m[r][1])} ${pad(s.m[r][2])}`);
      const br = (ls) => ls.map((t, i) => (i === 0 ? '⎡' : i === ls.length - 1 ? '⎣' : '⎢') + ' ' + t + ' ' + (i === 0 ? '⎤' : i === ls.length - 1 ? '⎦' : '⎥'));
      const Tcol = s.ok ? s.T.map(t => fmt(t, 1).padStart(7)) : ['  T₁', '  T₂', '  T₃'];
      const rhs = [fmt(-S.Fx, 0), fmt(-S.Fy, 0), fmt(S.W, 0)].map(x => x.padStart(5));
      const A_ = br(rows), T_ = br(['  T₁', '  T₂', '  T₃']), B_ = br(rhs);
      const mat = [0, 1, 2].map(i => `${A_[i]}${T_[i]}${i === 1 ? '  =  ' : '     '}${B_[i]}`).join('\n');
      let sol = ROW('Equilibrium ΣF = 0', `${SB('T', '1')}${I('û')}<sub>1</sub> + ${SB('T', '2')}${I('û')}<sub>2</sub> + ${SB('T', '3')}${I('û')}<sub>3</sub> + (${I('F')}<sub>x</sub>, ${I('F')}<sub>y</sub>, −${I('W')}) = 0`) +
        ROW('As a matrix', `<pre class="mat">${mat}</pre>`);
      const comp = ['x', 'y', 'z'].map((c, r) => `ΣF<sub>${c}</sub>: ${SB('T', '1')}(${fmt(s.m[r][0], 3)}) + ${SB('T', '2')}(${fmt(s.m[r][1], 3)}) + ${SB('T', '3')}(${fmt(s.m[r][2], 3)}) = ${fmt([-S.Fx, -S.Fy, S.W][r], 0)}`).join('<br>');
      sol += ROW('Component equations', comp);
      if (!s.ok) sol += ROW('Solution', '<span class="bad">det = 0: the three cable directions are coplanar, so the system is singular.</span>');
      else {
        sol += ROW('Solve (Gauss elimination)', `${SB('T', '1')} = ${RES(fmt(s.T[0], 2) + ' N')}, &nbsp; ${SB('T', '2')} = ${RES(fmt(s.T[1], 2) + ' N')}, &nbsp; ${SB('T', '3')} = ${RES(fmt(s.T[2], 2) + ' N')}`);
        if (s.T.some(t => t < 0)) sol += ROW('Physical check', '<span class="bad">A negative tension means that cable would have to push, so it goes slack.</span>');
        const sum = s.u.reduce((acc, u, i) => v3.add(acc, v3.mul(u, s.T[i])), [S.Fx, S.Fy, -S.W]);
        sol += ROW('Check', `|ΣF| = ${fmt(v3.len(sum), 4)} N ≈ 0 <span class="ok">✓</span>`);
      }
      return { setup, solution: sol };
    },
    down(x, y, e) {
      last = { x, y };
      if (!app.locked) {
        const h = hit(hs.map(o => ({ ...o })), x, y);
        if (h) { drag = h.key; return true; }
      }
      drag = 'orbit'; return true;
    },
    move(x, y) {
      if (!drag || !last) return;
      const dx = x - last.x, dy = y - last.y; last = { x, y };
      if (drag === 'orbit') {
        cam.yaw -= dx * 0.008; cam.pitch = clamp(cam.pitch + dy * 0.006, 8 * D2R, 82 * D2R);
        return;
      }
      const p = target(drag);
      if (S.vert) {
        const pr = proj(p), dz = -dy * (pr.d / cam.f) / Math.max(0.2, Math.cos(cam.pitch));
        setTarget(drag, [p[0], p[1], p[2] + dz]);
      } else {
        const w = unproj(x, y, p[2]);
        if (w) setTarget(drag, [snapv(w[0], 0.5), snapv(w[1], 0.5), p[2]]);
      }
    },
    up() { drag = null; last = null; },
    hover(x, y) { return app.locked ? 'grab' : hit(hs, x, y) ? 'pointer' : 'grab'; },
    wheel(dy) { cam.dist = clamp(cam.dist * (1 + Math.sign(dy) * 0.08), 8, 32); }
  };
})();

/* =====================================================================
   App shell: tabs, challenge harness, render loop
   ===================================================================== */
const MODS = [FeelMod, MomentMod, BeamMod, CableMod, TripodMod];
const ch = { mode: 'sandbox', cur: null, score: 0, streak: 0, solved: false, hold: 0, hint: false, last: -1, tries: 0 };
const HOLD = 0.9;

function renderTabs() {
  const nav = $('#tabs'); nav.innerHTML = '';
  MODS.forEach(m => {
    const b = document.createElement('button'); b.textContent = m.title; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(m === app.mod));
    b.onclick = () => select(m);
    nav.appendChild(b);
  });
}
function select(m) {
  app.mod = m; ch.mode = 'sandbox'; ch.cur = null; app.locked = false; app.hideSolution = false;
  m.reset();
  renderTabs(); buildControls(m);
  $('#blurb').innerHTML = m.blurb;
  renderChallenge(); app.dirty = true;
}
function setMode(mode) {
  ch.mode = mode;
  if (mode === 'sandbox') { ch.cur = null; app.locked = false; app.hideSolution = false; app.mod.reset(); renderChallenge(); app.dirty = true; }
  else newChallenge();
}
function newChallenge() {
  const defs = app.mod.challenges;
  let i; do { i = Math.floor(Math.random() * defs.length); } while (defs.length > 1 && i === ch.last);
  ch.last = i;
  ch.cur = defs[i].make(); ch.cur.name = defs[i].name;
  ch.solved = false; ch.hold = 0; ch.hint = false; ch.tries = 0;
  app.locked = ch.cur.kind === 'answer';
  app.hideSolution = app.locked;
  renderChallenge(); app.dirty = true;
}
function win() {
  ch.solved = true; ch.score += ch.hint ? 5 : 10; ch.streak++; app.flash = 1;
  app.locked = false; app.hideSolution = false;
  renderChallenge(); app.dirty = true;
}
function renderChallenge() {
  const box = $('#challenge');
  const seg = `<div class="seg" role="group" aria-label="Mode"><button data-m="sandbox" aria-pressed="${ch.mode === 'sandbox'}">Sandbox</button><button data-m="challenge" aria-pressed="${ch.mode === 'challenge'}">Challenge</button></div>`;
  let html = `<div class="chhead"><h2 style="margin:0">Mode</h2>${seg}${ch.mode === 'challenge' ? `<span class="score">Score ${ch.score} · Streak ${ch.streak}</span>` : ''}</div>`;
  if (ch.mode === 'sandbox') html += `<p class="status">Explore freely. Switch to <b>Challenge</b> for scored puzzles built on this module.</p>`;
  else if (ch.cur) {
    const c = ch.cur;
    html += `<div class="prompt"><b>${c.name}.</b> ${c.prompt}</div>`;
    if (c.kind === 'answer') {
      html += `<div class="ans"><input id="ansIn" inputmode="decimal" autocomplete="off" placeholder="Your answer (${c.unit})" ${ch.solved ? 'disabled' : ''}><button class="btn primary" id="ansBtn" ${ch.solved ? 'disabled' : ''}>Check</button></div>`;
      if (!ch.solved) html += `<div class="locked-note">The diagram is locked. Solve it, then the worked solution is revealed.</div>`;
    } else html += `<div class="status" id="chStatus"></div><div class="bar"><i id="chBar"></i></div>`;
    html += `<div class="fb ${ch.solved ? 'ok' : ''}" id="chFb" aria-live="polite">${ch.solved ? `✓ Solved! +${ch.hint ? 5 : 10} points.` : ''}</div>`;
    if (ch.hint && !ch.solved) html += `<div class="hint">${c.hint}</div>`;
    html += `<div class="row">${ch.solved ? '<button class="btn primary" id="nextBtn">Next challenge</button>' : '<button class="btn" id="hintBtn">Hint (−5)</button><button class="btn" id="skipBtn">Skip</button>'}</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#hintBtn', () => { ch.hint = true; renderChallenge(); });
  on('#skipBtn', () => { ch.streak = 0; newChallenge(); });
  on('#nextBtn', newChallenge);
  on('#ansBtn', checkAnswer);
  const inp = $('#ansIn'); if (inp) { inp.onkeydown = e => { if (e.key === 'Enter') checkAnswer(); }; if (!ch.solved) inp.focus({ preventScroll: true }); }
}
function checkAnswer() {
  const c = ch.cur, inp = $('#ansIn'), fb = $('#chFb'); if (!c || ch.solved) return;
  const v = parseFloat(inp.value.replace('−', '-').replace(',', '.'));
  if (!isFinite(v)) { fb.className = 'fb bad'; fb.textContent = 'Enter a number.'; return; }
  const a = c.answer(), tol = Math.max(c.tolAbs || 0, (c.tolRel || 0) * Math.abs(a));
  if (Math.abs(v - a) <= tol) win();
  else {
    ch.streak = 0; ch.tries++;
    fb.className = 'fb bad';
    fb.textContent = ch.tries >= 2 && Math.abs(v + a) <= tol ? 'Close: check the sign convention (counter-clockwise / upward positive).' : 'Not quite. Check signs, units and which point you take moments about.';
    if (ch.tries >= 2 && !ch.hint) { ch.hint = true; const h = document.createElement('div'); h.className = 'hint'; h.innerHTML = c.hint; fb.after(h); }
    const sc = $('#challenge .score'); if (sc) sc.textContent = `Score ${ch.score} · Streak ${ch.streak}`;
  }
}
let lastStatus = '';
function tick(dt) {
  if (app.mod.step) app.mod.step(dt);
  if (app.flash > 0) { app.flash = Math.max(0, app.flash - dt * 1.6); app.dirty = true; }
  if (ch.mode === 'challenge' && ch.cur && ch.cur.kind === 'target' && !ch.solved) {
    let ok = false; try { ok = ch.cur.ok(); } catch (e) { }
    ch.hold = ok ? ch.hold + dt : Math.max(0, ch.hold - dt * 2);
    if (ch.hold >= HOLD) return win();
    const bar = $('#chBar'), st = $('#chStatus');
    if (bar) bar.style.width = Math.min(100, ch.hold / HOLD * 100) + '%';
    let s = ''; try { s = ch.cur.status(); } catch (e) { }
    if (st && s !== lastStatus) { st.textContent = s; lastStatus = s; }
  }
}
function render() {
  const m = app.mod;
  g.clearRect(0, 0, app.w, app.h);
  m.draw(g, app.w, app.h);
  text(g, m.hint, 14, 18, COL.muted, { size: 12, halo: false });
  if (app.flash > 0) { g.save(); g.fillStyle = COL.react; g.globalAlpha = app.flash * 0.16; g.fillRect(0, 0, app.w, app.h); g.restore(); }
  const e = m.equations();
  $('#eq').innerHTML = `<h2>Equations</h2>` + GROUP('Given') + e.setup +
    (app.hideSolution ? `<div class="locked-note">The solution is hidden until you answer.</div>` : (e.solution ? GROUP('Solution') + e.solution : ''));
  syncControls(m);
}
function resize() {
  const r = cv.parentElement.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  app.w = r.width; app.h = r.height;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0); app.dirty = true;
}
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
let pointerDown = false;
cv.addEventListener('pointerdown', e => {
  const p = pos(e);
  if (app.mod.down(p.x, p.y, e)) { pointerDown = true; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; app.dirty = true; e.preventDefault(); }
});
cv.addEventListener('pointermove', e => {
  const p = pos(e);
  if (pointerDown) { app.mod.move(p.x, p.y, e); app.dirty = true; }
  else cv.style.cursor = app.mod.hover ? app.mod.hover(p.x, p.y) : 'default';
});
const endDrag = e => { if (pointerDown) { pointerDown = false; app.mod.up(); cv.style.cursor = 'default'; app.dirty = true; } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { if (!pointerDown && app.mod.hover) { app.mod.hover(-999, -999); } });
cv.addEventListener('wheel', e => { if (app.mod.wheel) { e.preventDefault(); app.mod.wheel(e.deltaY); app.dirty = true; } }, { passive: false });

$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('statics-theme', document.documentElement.dataset.theme); } catch (e) { }
  readColors(); app.dirty = true;
};
try { const t = localStorage.getItem('statics-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); app.dirty = true; });

readColors();
new ResizeObserver(resize).observe(cv.parentElement);
select(FeelMod);
resize();
let lastT = performance.now();
(function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  tick(dt);
  if (app.dirty) { app.dirty = false; render(); }
  requestAnimationFrame(frame);
})(lastT);
</script>
</body>
</html>
